<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Meta -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Title -->
  <title>LoreRim Alchemy Book</title>

  <!--
    CACHE VERSION
    Change ONLY this number whenever you publish an update.
    Example: "1.0.0" -> "1.0.1" -> "1.0.2"
  -->
  <script>
    const ASSET_VERSION = "1.0.0";

    const styles = [
      "css/base.css",
      "css/book-shell.css",
      "css/navigation.css",
      "css/dropdowns.css",
      "css/toc.css",
      "css/potion-builder.css",
      "css/potion-database.css",
      "css/ingredient-lookup.css",
      "css/effect-lookup.css",
      "css/witcher.css",
      "css/ingredientCollection.css",
      "css/extraTips.css",
      "css/changelog.css",
      "css/responsive-mobile.css"
    ];

    styles.forEach(href => {
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = `${href}?v=${ASSET_VERSION}`;
      document.head.appendChild(link);
    });
  </script>

</head>

<body>

  <!-- Main Book -->
  <main class="app">

    <section
      id="book"
      class="book closed"
      aria-label="LoreRim Alchemy Book"
    >

      <!-- Cover -->
      <button
        id="coverButton"
        class="book-cover"
        type="button"
        aria-label="Open LoreRim Alchemy Book"
      >
      </button>

      <!-- Book Interior -->
      <div class="book-inside">

        <div class="book-frame-overlay"></div>

        <div class="page-thickness left"></div>
        <div class="page-thickness right"></div>

        <div
          id="pageFlipOverlay"
          class="page-flip-overlay"
        ></div>

        <!-- Previous Page -->
        <button
          id="prevPage"
          class="nav-btn left"
          type="button"
          aria-label="Previous page"
        >
          <span>‹</span>
        </button>

        <!-- Left Page -->
        <section class="page left-page">
          <div
            class="page-inner"
            id="leftPageInner"
          >
            <div id="leftPageContent"></div>
          </div>
        </section>

        <!-- Right Page -->
        <section class="page right-page">
          <div
            class="page-inner"
            id="rightPageInner"
          >
            <div id="rightPageContent"></div>
          </div>
        </section>

        <!-- Next Page -->
        <button
          id="nextPage"
          class="nav-btn right"
          type="button"
          aria-label="Next page"
        >
          <span>›</span>
        </button>

      </div>
    </section>
  </main>

  <!--
    VERSIONED SCRIPT LOADER
    Scripts are deliberately loaded one at a time
    so your existing dependency/load order is preserved.
  -->
  <script>
    const scripts = [
      // Utils
      "js/utils/helpers.js",

      // Systems
      "js/systems/storage.js",
      "js/systems/analytics.js",

      // Core Shared UI / Logic
      "js/core/dropdowns.js",
      "js/core/renderers.js",
      "js/core/effects.js",

      // Feature Pages
      "js/features/potionDatabase.js",
      "js/features/ingredientLookup.js",
      "js/features/effectLookup.js",
      "js/features/ingredientCollection.js",

      // Feature Logic
      "js/features/potionBuilder.js",
      "js/features/witcherConsumables.js",

      // Navigation / App Init
      "js/systems/navigation.js",
      "js/app.js"
    ];

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = `${src}?v=${ASSET_VERSION}`;
        script.onload = resolve;
        script.onerror = () => reject(
          new Error(`Failed to load ${src}`)
        );
        document.body.appendChild(script);
      });
    }

    async function loadAppScripts() {
      for (const src of scripts) {
        await loadScript(src);
      }
    }

    loadAppScripts().catch(error => {
      console.error("LoreRim Alchemy Book failed to load:", error);
    });
  </script>

  <!-- GoatCounter Analytics -->
  <script
    data-goatcounter="https://rudy3172.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js">
  </script>

</body>
</html>
