<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Meta -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Title -->
  <title>LoreRim Alchemy Book</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/book-shell.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/dropdowns.css">
  <link rel="stylesheet" href="css/toc.css">
  <link rel="stylesheet" href="css/potion-builder.css">
  <link rel="stylesheet" href="css/potion-database.css">
  <link rel="stylesheet" href="css/ingredient-lookup.css">
  <link rel="stylesheet" href="css/effect-lookup.css">
  <link rel="stylesheet" href="css/witcher.css">
  <link rel="stylesheet" href="css/responsive-mobile.css">

</head>

<body>

  <!-- Main Book -->
  <main class="app">

    <section
      id="book"
      class="book closed"
      aria-label="LoreRim Alchemy Book"
    >

      <!-- Cover -->
      <button
        id="coverButton"
        class="book-cover"
        type="button"
        aria-label="Open LoreRim Alchemy Book"
      >
      </button>

      <!-- Book Interior -->
      <div class="book-inside">

        <div class="book-frame-overlay"></div>

        <div class="page-thickness left"></div>
        <div class="page-thickness right"></div>

        <div
          id="pageFlipOverlay"
          class="page-flip-overlay"
        ></div>

        <!-- Previous Page -->
        <button
          id="prevPage"
          class="nav-btn left"
          type="button"
          aria-label="Previous page"
        >
          <span>‹</span>
        </button>

        <!-- Left Page -->
        <section class="page left-page">
          <div
            class="page-inner"
            id="leftPageInner"
          >
            <div id="leftPageContent"></div>
          </div>
        </section>

        <!-- Right Page -->
        <section class="page right-page">
          <div
            class="page-inner"
            id="rightPageInner"
          >
            <div id="rightPageContent"></div>
          </div>
        </section>

        <!-- Next Page -->
        <button
          id="nextPage"
          class="nav-btn right"
          type="button"
          aria-label="Next page"
        >
          <span>›</span>
        </button>

      </div>
    </section>
  </main>

  <!-- Core -->
  <script src="js/helpers.js"></script>
  <script src="js/storage.js"></script>

  <!-- Lookups -->
  <script src="js/potionDatabase.js"></script>
  <script src="js/ingredientLookup.js"></script>
  <script src="js/effectLookup.js"></script>

  <!-- Data -->
  <script src="data/ingredients.js"></script>
  <script src="data/effects.js"></script>

  <!-- Features -->
  <script src="js/potionBuilder.js"></script>
  <script src="js/witcherConsumables.js"></script>

  <!-- App -->
  <script src="js/navigation.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
